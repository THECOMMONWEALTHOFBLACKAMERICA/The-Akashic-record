<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T.A.R. — The Akashic Records</title><style>body{font-family:system-ui;background:#090b10;color:#eee;max-width:1050px;margin:40px auto;padding:20px}textarea,input{width:100%;box-sizing:border-box;background:#121722;color:#fff;border:1px solid #333;padding:12px;border-radius:8px}textarea{min-height:120px}button{padding:11px 16px;margin:8px 6px 8px 0;border:0;border-radius:8px;cursor:pointer}.panel{background:#0f131c;border:1px solid #222;padding:18px;border-radius:12px;margin:18px 0}pre{white-space:pre-wrap;background:#121722;padding:18px;border-radius:8px}a{color:#9ecbff}.source{padding:10px 0;border-bottom:1px solid #222}.meta{color:#9aa4b2;font-size:.9rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><h1>T.A.R.</h1><p>The Akashic Records — persistent research with traceable sources.</p><div class="panel"><h2>Ask</h2><textarea id="q" placeholder="Ask anything..."></textarea><button onclick="ask()">Research</button><pre id="answer">Ready.</pre><div id="sources"></div></div><div class="grid"><div class="panel"><h2>Ingest knowledge</h2><input id="file" type="file" accept=".pdf,.txt,.md,.csv,.json"><input id="title" placeholder="Optional title"><input id="source" placeholder="Source label (example: dawes_rolls)"><button onclick="upload()">Ingest file</button><pre id="uploadStatus">No upload yet.</pre></div><div class="panel"><h2>Recall memory</h2><input id="memoryQuery" placeholder="Search ingested and remembered knowledge"><button onclick="recall()">Recall</button><div id="memoryResults"></div></div></div><script>const API='http://localhost:8000';function render(container,items){container.innerHTML='';(items||[]).forEach(s=>{const e=document.createElement('div');e.className='source';const title=document.createElement(s.url?'a':'strong');if(s.url){title.href=s.url;title.target='_blank';title.rel='noopener'}title.textContent=`${s.source||s.kind||'record'}: ${s.title||'Untitled'}`;e.appendChild(title);const m=document.createElement('div');m.className='meta';m.textContent=[s.page?`page ${s.page}`:'',s.retrieval_score?`score ${s.retrieval_score}`:''].filter(Boolean).join(' • ');e.appendChild(m);const p=document.createElement('div');p.textContent=(s.snippet||'').slice(0,500);e.appendChild(p);container.appendChild(e)})}async function ask(){const q=document.getElementById('q').value;answer.textContent='Researching...';sources.innerHTML='';try{const r=await fetch(API+'/v1/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,research:true})});const d=await r.json();answer.textContent=d.answer||JSON.stringify(d,null,2);render(sources,d.sources)}catch(e){answer.textContent=String(e)}}async function upload(){const f=file.files[0];if(!f){uploadStatus.textContent='Choose a file.';return}const fd=new FormData();fd.append('file',f);if(title.value)fd.append('title',title.value);fd.append('source',source.value||'upload');uploadStatus.textContent='Ingesting...';try{const r=await fetch(API+'/v1/ingest/file',{method:'POST',body:fd});const d=await r.json();uploadStatus.textContent=JSON.stringify(d,null,2)}catch(e){uploadStatus.textContent=String(e)}}async function recall(){const q=memoryQuery.value;memoryResults.innerHTML='Searching...';try{const r=await fetch(API+'/v1/memory/recall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,limit:12})});const d=await r.json();render(memoryResults,d.results)}catch(e){memoryResults.textContent=String(e)}}</script></body></html>
