<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T.A.R. — The Akashic Records</title><style>body{font-family:system-ui;background:#090b10;color:#eee;max-width:900px;margin:50px auto;padding:20px}textarea{width:100%;min-height:130px;background:#121722;color:#fff;border:1px solid #333;padding:14px}button{padding:12px 18px;margin-top:10px}pre{white-space:pre-wrap;background:#121722;padding:18px;border-radius:8px}a{color:#9ecbff}.source{padding:10px 0;border-bottom:1px solid #222}</style></head><body><h1>T.A.R.</h1><p>The Akashic Records — research with traceable sources.</p><textarea id="q" placeholder="Ask anything..."></textarea><br><button onclick="ask()">Research</button><h2>Answer</h2><pre id="answer">Ready.</pre><h2>Sources</h2><div id="sources"></div><script>async function ask(){const q=document.getElementById('q').value;answer.textContent='Researching...';sources.innerHTML='';try{const r=await fetch('http://localhost:8000/v1/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,research:true})});const d=await r.json();answer.textContent=d.answer||JSON.stringify(d,null,2);(d.sources||[]).forEach(s=>{const e=document.createElement('div');e.className='source';const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener';a.textContent=`${s.source}: ${s.title}`;e.appendChild(a);sources.appendChild(e)})}catch(e){answer.textContent=String(e)}}</script></body></html>
