name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tar
          POSTGRES_PASSWORD: tar_ci_password
          POSTGRES_DB: tar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tar -d tar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TAR_DATABASE_URL: postgresql+psycopg://tar:tar_ci_password@localhost:5432/tar
      TAR_ARTIFACT_DIR: /tmp/tar-artifacts
      TAR_ENABLE_CODE_EXECUTION: "false"
      TAR_REQUIRE_API_KEY: "false"
      TAR_LLM_PROVIDER: echo
      TAR_ENABLE_SEMANTIC_RETRIEVAL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q backend scripts
      - run: alembic upgrade head
      - run: pytest -q
      - name: Start API and worker
        run: |
          uvicorn backend.app.production:app --host 127.0.0.1 --port 8000 > /tmp/tar-api.log 2>&1 &
          echo $! > /tmp/tar-api.pid
          python -m backend.worker > /tmp/tar-worker.log 2>&1 &
          echo $! > /tmp/tar-worker.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tar-api.log
          exit 1
      - run: python scripts/smoke_test.py
        env:
          TAR_SMOKE_URL: http://127.0.0.1:8000
          TAR_SMOKE_JOB_TIMEOUT: "30"
      - name: Dump service logs on failure
        if: failure()
        run: |
          cat /tmp/tar-api.log || true
          cat /tmp/tar-worker.log || true

  governance-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: tar-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
