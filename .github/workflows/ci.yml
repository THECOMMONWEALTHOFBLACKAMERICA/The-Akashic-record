name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tar
          POSTGRES_PASSWORD: tar_ci_password
          POSTGRES_DB: tar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tar -d tar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TAR_DATABASE_URL: postgresql+psycopg://tar:tar_ci_password@localhost:5432/tar
      TAR_ARTIFACT_DIR: /tmp/tar-artifacts
      TAR_ENABLE_CODE_EXECUTION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q backend
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tar-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
