services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on: [ipfs]
  web:
    image: nginx:alpine
    ports: ["3000:80"]
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    depends_on: [api]
  ipfs:
    image: ipfs/kubo:latest
    ports: ["4001:4001","5001:5001","8080:8080"]
    volumes: ["ipfs_data:/data/ipfs"]
volumes:
  ipfs_data:
