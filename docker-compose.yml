services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tar
      POSTGRES_USER: tar
      POSTGRES_PASSWORD: ${TAR_POSTGRES_PASSWORD:?set TAR_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tar -d tar"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      TAR_DATABASE_URL: postgresql+psycopg://tar:${TAR_POSTGRES_PASSWORD}@postgres:5432/tar
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      TAR_DATABASE_URL: postgresql+psycopg://tar:${TAR_POSTGRES_PASSWORD}@postgres:5432/tar
      TAR_ARTIFACT_DIR: /app/data/artifacts
      TAR_ENABLE_CODE_EXECUTION: "false"
    ports: ["8000:8000"]
    volumes:
      - tar_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      ipfs:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.worker"]
    env_file: .env
    environment:
      TAR_DATABASE_URL: postgresql+psycopg://tar:${TAR_POSTGRES_PASSWORD}@postgres:5432/tar
      TAR_ARTIFACT_DIR: /app/data/artifacts
      TAR_NODE_NAME: tar-worker-1
      TAR_NODE_CAPABILITIES: research,text,image,video
      TAR_ENABLE_CODE_EXECUTION: "false"
    volumes:
      - tar_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: nginx:alpine
    ports: ["3000:80"]
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    depends_on:
      api:
        condition: service_healthy

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:8080:8080"
    volumes:
      - ipfs_data:/data/ipfs

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    profiles: ["distributed-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TAR_MINIO_ROOT_USER:?set TAR_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${TAR_MINIO_ROOT_PASSWORD:?set TAR_MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    profiles: ["distributed-storage"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      TAR_MINIO_ROOT_USER: ${TAR_MINIO_ROOT_USER}
      TAR_MINIO_ROOT_PASSWORD: ${TAR_MINIO_ROOT_PASSWORD}
      TAR_S3_BUCKET: ${TAR_S3_BUCKET:-tar-artifacts}
    entrypoint: >-
      /bin/sh -c '
      mc alias set tar http://minio:9000 "$${TAR_MINIO_ROOT_USER}" "$${TAR_MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing "tar/$${TAR_S3_BUCKET}" &&
      mc anonymous set none "tar/$${TAR_S3_BUCKET}"
      '

volumes:
  postgres_data:
  ipfs_data:
  tar_data:
  prometheus_data:
  minio_data:
