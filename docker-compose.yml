services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tar
      POSTGRES_USER: tar
      POSTGRES_PASSWORD: ${TAR_POSTGRES_PASSWORD:?set TAR_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tar -d tar"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      TAR_DATABASE_URL: postgresql+psycopg://tar:${TAR_POSTGRES_PASSWORD}@postgres:5432/tar
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      TAR_DATABASE_URL: postgresql+psycopg://tar:${TAR_POSTGRES_PASSWORD}@postgres:5432/tar
      TAR_ARTIFACT_DIR: /app/data/artifacts
      TAR_ENABLE_CODE_EXECUTION: "false"
    ports: ["8000:8000"]
    volumes:
      - tar_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      ipfs:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.worker"]
    env_file: .env
    environment:
      TAR_DATABASE_URL: postgresql+psycopg://tar:${TAR_POSTGRES_PASSWORD}@postgres:5432/tar
      TAR_ARTIFACT_DIR: /app/data/artifacts
      TAR_NODE_NAME: tar-worker-1
      TAR_NODE_CAPABILITIES: research,text,image,video
      TAR_ENABLE_CODE_EXECUTION: "false"
    volumes:
      - tar_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: nginx:alpine
    ports: ["3000:80"]
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    depends_on:
      api:
        condition: service_healthy

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:8080:8080"
    volumes:
      - ipfs_data:/data/ipfs

volumes:
  postgres_data:
  ipfs_data:
  tar_data:
